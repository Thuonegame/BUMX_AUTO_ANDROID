name: Build BUMX_AUTO APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn về
        uses: actions/checkout@v4

      - name: Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Khởi tạo Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Chạy lệnh tạo APK
        run: gradle assembleDebug

      - name: Xuất file APK
        uses: actions/upload-artifact@v4
        with:
          name: BUMX-AUTO-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
